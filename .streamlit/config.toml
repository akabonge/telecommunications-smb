[client]
showErrorDetails = true

[logger]
level = "info"

[theme]
primaryColor = "#1E88E5"
backgroundColor = "#F5F5F5"
secondaryBackgroundColor = "#E8EAED"
textColor = "#31333F"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true

[client.toolbarMode]
mode = "minimal"
